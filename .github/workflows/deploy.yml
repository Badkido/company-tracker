name: deploy
on:
  push:
    branches: [main]
    paths: [site/**, data/**]
  workflow_run:   # 机器人用默认令牌推送的提交不会触发 push，所以在这些任务成功后补一次部署
    workflows: [ingest, price, edgar, 13f, tencent]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -R site/* _site/ && cp -R data _site/data && rm -rf _site/data/pdd/pending
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
